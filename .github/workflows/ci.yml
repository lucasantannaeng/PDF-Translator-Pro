name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python Syntax & Module Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Compilation Verification
        run: |
          python -m py_compile cli.py translate_batch.py core/*.py gui/*.py

      - name: Import Core Modules Test
        run: |
          python -c "import core.config, core.llm_router, core.pdf_analyzer, core.glossary; print('Core PDF Translator modules imported successfully!')"
